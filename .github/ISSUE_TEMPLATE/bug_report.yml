name: Сообщить об ошибке
description: Что-то не работает в приложении
title: "[BUG] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Что случилось
      description: Опишите проблему; по возможности приложите скриншот.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: Настройки -> О приложении.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - Android
        - Windows
        - macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Шаги, после которых проблема появляется.
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: Вставьте текст логов, если есть.
      render: text
