# Сборка клиента в GitHub Actions.
#
# Как запускается:
#   * push в ветку main            -> собираются все пакеты, лежат во вкладке
#                                     Actions -> выбранный запуск -> Artifacts;
#   * push тега v*  (например v1.0.0) -> то же самое + создаётся GitHub Release
#                                     с прикреплёнными файлами. Тег с дефисом
#                                     (v1.0.0-beta.1) помечается как pre-release;
#   * вручную: Actions -> build -> "Run workflow" -> можно выбрать платформу
#                                     и собрать "stable"-вариант.
#
# Что собирается (матрица в job "build"):
#   android  -> APK для arm64-v8a, armeabi-v7a, x86_64 (один раннер Ubuntu)
#   windows  -> zip (portable) + setup.exe, x64
#   macos    -> dmg для Apple Silicon (arm64) и для Intel (amd64)
# Linux и Windows-arm64 отключены, заготовки оставлены в комментариях ниже.
#
# Секреты (Settings -> Secrets and variables -> Actions). Все НЕОБЯЗАТЕЛЬНЫ:
#   KEYSTORE        base64 от файла keystore.jks: `base64 -i keystore.jks | pbcopy`
#   KEY_ALIAS       alias ключа внутри keystore
#   STORE_PASSWORD  пароль keystore
#   KEY_PASSWORD    пароль ключа
# Если секретов нет, release-APK подписывается debug-ключом и получает
# суффикс ".dev" в applicationId (так устроен android/app/build.gradle.kts) -
# для теста годится, в магазин такой APK не загрузить.
# Создать keystore: keytool -genkey -v -keystore keystore.jks -keyalg RSA
#   -keysize 2048 -validity 10000 -alias <alias>

name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Что собирать'
        type: choice
        default: all
        options:
          - all
          - android
          - windows
          - macos
      stable:
        description: 'Собрать как stable (иначе pre: в приложении виден бейдж PRE)'
        type: boolean
        default: false

# Новый push в ту же ветку отменяет ещё идущую сборку; релизы (теги) не отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  # Версии инструментов. Flutter и NDK менять только вместе с .agents/flutter-upgrade.md.
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  # stable: тег без дефиса (v1.0.0) либо галочка "stable" при ручном запуске.
  IS_STABLE: ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || inputs.stable == true }}
  # Кэши пишем только из веток: каждый тег - новый ключ кэша, который больше
  # никто не прочитает, а место под кэш в репозитории ограничено (10 ГБ).
  BRANCH_CACHE: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # analyze: быстрая проверка Dart-кода (flutter analyze). НЕ блокирует сборку:
  # предупреждения видны в логе и в Summary, но сборка идёт дальше.
  analyze:
    name: Dart analyze (не блокирует)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # plan: решает, какие строки матрицы собирать. При push - все; при ручном
  # запуске - только выбранную платформу. Результат - JSON для job "build".
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Choose platforms
        id: plan
        env:
          SELECTED: ${{ inputs.platforms || 'all' }}
        run: |
          # Полный список целей. Чтобы включить Linux или Windows arm64 -
          # раскомментируйте строку (Linux соберёт deb/rpm/AppImage).
          all='[
            {"platform":"android","os":"ubuntu-latest"},
            {"platform":"windows","os":"windows-2022","arch":"amd64"},
            {"platform":"macos","os":"macos-latest","arch":"arm64"},
            {"platform":"macos","os":"macos-15-intel","arch":"amd64"}
          ]'
          # {"platform":"linux","os":"ubuntu-22.04","arch":"amd64"},
          # {"platform":"windows","os":"windows-11-arm","arch":"arm64","flutter-channel":"master"},
          if [ "$SELECTED" = all ]; then
            matrix=$(jq -c . <<<"$all")
          else
            matrix=$(jq -c --arg p "$SELECTED" '[.[] | select(.platform == $p)]' <<<"$all")
          fi
          echo "Собираем: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # build: одна строка матрицы = один раннер = один набор пакетов.
  # Внутри всё делает `dart setup.dart <platform>`: собирает Go-ядро, Rust-хелпер,
  # Flutter-приложение и упаковывает через flutter_distributor в ./dist.
  # Имена файлов: <app_name из distribute_options.yaml>-<версия из pubspec.yaml>-<платформа>-<arch>.<ext>
  build:
    name: Build ${{ matrix.platform }}${{ matrix.arch && format(' {0}', matrix.arch) || '' }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false # падение одной платформы не отменяет остальные
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Setup Rust (windows arm64)
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # submodules: recursive - подтягивает core/Clash.Meta (URL в .gitmodules - https).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Подпись Android. Если секрета KEYSTORE нет - шаг просто пишет заметку,
      # gradle соберёт APK с debug-подписью (см. шапку файла).
      - name: Setup Android signing (optional)
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::notice title=Android signing::Секреты KEYSTORE/KEY_ALIAS/STORE_PASSWORD/KEY_PASSWORD не заданы - APK будет с debug-подписью (applicationId с суффиксом .dev)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties
          echo "Release keystore configured."

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (Android)
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.BRANCH_CACHE != 'true' }}

      # Go-ядро для Android собирается gomobile внутри gradle, ему нужен NDK.
      - name: Setup NDK (Android)
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup Xcode (macOS)
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app \
            || sudo xcode-select -s /Applications/Xcode_26.2.app \
            || echo "Using default Xcode"
          xcodebuild -version

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: Flutter pub get
        run: |
          flutter --version
          flutter pub get

      # На Intel-маках Impeller даёт артефакты рендера - отключаем (см. .agents/flutter-upgrade.md).
      - name: Disable Impeller on Intel macOS
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      # В подмодуле файл ca-certificates.crt пустой: ядро встраивает его через
      # go:embed, а приложение доверяет этим корням при TLS. Скачиваем бандл
      # Mozilla c curl.se и проверяем хеш. Новый бандл = осознанное обновление
      # двух строк ниже (хеш берётся с https://curl.se/docs/caextract.html).
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      # Главный шаг. --env stable убирает бейдж PRE; -v - подробный лог Flutter.
      - name: Build packages (dart setup.dart)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: List packages
        shell: bash
        run: ls -la dist/

      # Артефакты запуска: Actions -> этот run -> раздел Artifacts (хранятся 90 дней).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: |
            dist/*.apk
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error
          overwrite: true

  # release: только для тегов v*. Складывает пакеты всех платформ в один
  # GitHub Release, добавляет SHA256SUMS и автогенерированный список изменений.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # нужно, чтобы создать Release и загрузить файлы
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          ls -la
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
